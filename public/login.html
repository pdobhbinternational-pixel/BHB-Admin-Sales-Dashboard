<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin System - Login</title>
  <link rel="icon" href="/graphics/blackBHBLogo.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/graphics/whiteBHBLogo.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="max-w-md w-full">
    <!-- Brand / Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center mb-4">
        <img 
            src="./graphics/blackBHBLogo.svg" 
            alt="BHB International Logo" 
            class="h-20 w-auto object-contain"
        />
        </div>
      <h1 class="text-2xl font-bold text-slate-900">BHB International Admin Portal</h1>
      <p class="text-slate-500 text-sm mt-1">Sign in to manage inquiries and performance</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 p-8 border border-slate-200/80">
      
      <!-- Alert Message Box -->
      <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm border font-medium flex items-center gap-3">
        <i id="alertIcon" class="fa-solid text-lg"></i>
        <span id="alertMessage"></span>
      </div>

      <form id="loginForm" class="space-y-5">
        <!-- Email Input -->
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-envelope"></i>
            </div>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required
              placeholder="admin@example.com"
              class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
            >
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
            >
            <button 
              type="button" 
              id="togglePassword" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
            >
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition-all shadow-md shadow-indigo-100 flex items-center justify-center gap-2 active:scale-[0.99]"
        >
          <span id="btnText">Sign In</span>
          <i id="btnSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
        </button>
      </form>
    </div>

    <!-- Footer Note -->
    <p class="text-center text-slate-400 text-xs mt-8">
      &copy; 2026 BHB International System. Restricted Access.
    </p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const alertBox = document.getElementById('alertBox');
    const alertMessage = document.getElementById('alertMessage');
    const alertIcon = document.getElementById('alertIcon');
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    // Show/Hide Password Toggle
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      eyeIcon.classList.toggle('fa-eye');
      eyeIcon.classList.toggle('fa-eye-slash');
    });

    // Helper: Show Alert
    function showAlert(message, type = 'error') {
      alertBox.classList.remove('hidden', 'bg-rose-50', 'border-rose-200', 'text-rose-700', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
      
      if (type === 'error') {
        alertBox.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-700');
        alertIcon.className = 'fa-solid fa-triangle-exclamation text-lg';
      } else {
        alertBox.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
        alertIcon.className = 'fa-solid fa-circle-check text-lg';
      }

      alertMessage.textContent = message;
    }

    // Form Submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      // Start Loading State
      submitBtn.disabled = true;
      btnText.textContent = 'Authenticating...';
      btnSpinner.classList.remove('hidden');
      alertBox.classList.add('hidden');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/index.html'; // Redirect to dashboard
          }, 1000);
        } else {
          showAlert(result.error || 'Invalid credentials. Please try again.');
        }
      } catch (err) {
        console.error('Login error:', err);
        showAlert('Network error. Failed to reach authentication server.');
      } finally {
        // Reset Loading State
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In';
        btnSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
